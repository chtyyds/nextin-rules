# Nextin 手动选择版订阅覆写模板 | 2026-11-11
# 所有策略组均为 select；无自动测速、自动切换或故障回退。
# 导入后先到「手动节点」选择一个真实节点；也可进入各地区节点组分别手动选节点。
# 节点选择、AI服务和流媒体默认使用「手动节点」；Apple/微软默认直连。
# 香港/日本/美国/新加坡/台湾仅按名称筛选，不自动选择或测速。
# 没有可用节点时请手动改选；REJECT 是拒绝连接，不是代理节点。
# 作为 Nextin YAML 模板/分流覆写导入并关联已有订阅，proxies 由 App 注入。
# DNS 接管及 iOS 隧道由 Nextin 管理；ipv6:false 不能阻止隧道外 IPv6。
# 国内及节点域名用直连加密 DNS，国外域名用代理加密 DNS；本地域名使用 system。
# 国内域名和IP规则库每日更新；其余域名规则是创建日快照。
# 规则来源：MetaCubeX/meta-rules-dat；域名拦截无法阻止全部广告及追踪。

x-nextin:
  version: 1
  mode: subscription-template
mode: rule
log-level: warning
allow-lan: false
ipv6: false
profile:
  store-selected: true
  store-fake-ip: true
hosts:
  dns.alidns.com: 223.5.5.5
  doh.pub: 1.12.12.12
  cloudflare-dns.com: 1.1.1.1
  dns.google: 8.8.8.8
proxies: []
proxy-groups:
- name: 节点选择
  type: select
  proxies:
  - 手动节点
  - 香港节点
  - 日本节点
  - 美国节点
  - 新加坡节点
  - 台湾节点
- name: AI服务
  type: select
  proxies:
  - 手动节点
  - 美国节点
  - 日本节点
  - 新加坡节点
  - 台湾节点
  - 香港节点
- name: YouTube
  type: select
  proxies:
  - 手动节点
  - 香港节点
  - 日本节点
  - 美国节点
  - 新加坡节点
  - 台湾节点
- name: Netflix
  type: select
  proxies:
  - 手动节点
  - 香港节点
  - 日本节点
  - 美国节点
  - 新加坡节点
  - 台湾节点
- name: TikTok
  type: select
  proxies:
  - 手动节点
  - 美国节点
  - 日本节点
  - 新加坡节点
  - 台湾节点
  - 香港节点
- name: 其他流媒体
  type: select
  proxies:
  - 手动节点
  - 香港节点
  - 日本节点
  - 美国节点
  - 新加坡节点
  - 台湾节点
- name: Apple服务
  type: select
  proxies:
  - DIRECT
  - 节点选择
  - 香港节点
  - 日本节点
  - 美国节点
  - 新加坡节点
  - 台湾节点
  - 手动节点
- name: 微软服务
  type: select
  proxies:
  - DIRECT
  - 节点选择
  - 香港节点
  - 日本节点
  - 美国节点
  - 新加坡节点
  - 台湾节点
  - 手动节点
- name: 广告与追踪
  type: select
  proxies:
  - REJECT
  - DIRECT
- name: 手动节点
  type: select
  include-all-proxies: true
  exclude-filter: (?i)(剩余|到期|过期|套餐|流量|更新|官网|公告|重置|Traffic|Expire|Reset|Bandwidth)
  proxies:
  - REJECT
- name: 香港节点
  type: select
  include-all-proxies: true
  filter: (?i)(香港|港仔|Hong.?Kong|\bHK\b|HK[-_ ]?[0-9]|🇭🇰)
  exclude-filter: (?i)(剩余|到期|过期|套餐|流量|更新|官网|公告|重置|Traffic|Expire|Reset|Bandwidth)
  proxies:
  - REJECT
- name: 日本节点
  type: select
  include-all-proxies: true
  filter: (?i)(日本|东京|大阪|Japan|Tokyo|Osaka|\bJP\b|JP[-_ ]?[0-9]|🇯🇵)
  exclude-filter: (?i)(剩余|到期|过期|套餐|流量|更新|官网|公告|重置|Traffic|Expire|Reset|Bandwidth)
  proxies:
  - REJECT
- name: 美国节点
  type: select
  include-all-proxies: true
  filter: (?i)(美国|美國|洛杉矶|硅谷|西雅图|纽约|United.?States|America|Los.?Angeles|Seattle|\bUSA?\b|US[-_ ]?[0-9]|🇺🇸)
  exclude-filter: (?i)(剩余|到期|过期|套餐|流量|更新|官网|公告|重置|Traffic|Expire|Reset|Bandwidth)
  proxies:
  - REJECT
- name: 新加坡节点
  type: select
  include-all-proxies: true
  filter: (?i)(新加坡|狮城|獅城|Singapore|\bSG\b|SG[-_ ]?[0-9]|🇸🇬)
  exclude-filter: (?i)(剩余|到期|过期|套餐|流量|更新|官网|公告|重置|Traffic|Expire|Reset|Bandwidth)
  proxies:
  - REJECT
- name: 台湾节点
  type: select
  include-all-proxies: true
  filter: (?i)(台湾|台灣|台北|Taiwan|Taipei|\bTW\b|TW[-_ ]?[0-9]|🇹🇼)
  exclude-filter: (?i)(剩余|到期|过期|套餐|流量|更新|官网|公告|重置|Traffic|Expire|Reset|Bandwidth)
  proxies:
  - REJECT
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  - +.home.arpa
  - localhost
  - +.localhost
  - time.*.com
  - ntp.*.com
  - +.pool.ntp.org
  - +.msftconnecttest.com
  - +.msftncsi.com
  respect-rules: true
  prefer-h3: false
  use-hosts: true
  default-nameserver:
  - https://223.5.5.5/dns-query
  proxy-server-nameserver:
  - https://dns.alidns.com/dns-query#DIRECT
  - https://doh.pub/dns-query#DIRECT
  direct-nameserver:
  - https://dns.alidns.com/dns-query#DIRECT
  - https://doh.pub/dns-query#DIRECT
  direct-nameserver-follow-policy: false
  nameserver:
  - https://cloudflare-dns.com/dns-query#节点选择
  - https://dns.google/dns-query#节点选择
  nameserver-policy:
    rule-set:cn-domain:
    - https://dns.alidns.com/dns-query#DIRECT
    - https://doh.pub/dns-query#DIRECT
    +.lan: system
    +.local: system
    +.home.arpa: system
rule-providers:
  cn-domain:
    type: http
    behavior: domain
    format: mrs
    path: ./ruleset/cn-domain.mrs
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/cn.mrs
    interval: 86400
    proxy: 节点选择
  cn-ip:
    type: http
    behavior: ipcidr
    format: mrs
    path: ./ruleset/cn-ip.mrs
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/cn.mrs
    interval: 86400
    proxy: 节点选择

rules:
  # 局域网与加密 DNS 引导；不影响家中 NAS / Home Assistant
